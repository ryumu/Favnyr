[package]
name = "favnyr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Favnyr core: config, i18n, XDG paths, logging, workspace model."
publish = false   # internal crate (never published to crates.io)

[dependencies]
serde              = { workspace = true }
serde_json         = "1"
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror          = { workspace = true }
image              = { workspace = true }
dirs               = { workspace = true }
trash              = { workspace = true }
sysinfo            = { workspace = true }
zip                = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters"] }
